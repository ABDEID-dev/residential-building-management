<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الداشبورد - خدمات برج العامر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007-brand">
</head>
<body>
  <div class="app-shell hidden" id="appShell">
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <header class="mobile-appbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="القائمة">☰</button>
      <div class="mobile-title">
        <strong>خدمات برج العامر</strong>
        <span id="mobileUserText"></span>
      </div>
      <button class="icon-btn notify-btn" id="notifyBtn" type="button" aria-label="الإشعارات">
        <span>🔔</span>
        <b id="notifyBadge" hidden>0</b>
      </button>
      <div class="notification-popover" id="notificationPanel" hidden>
        <strong>الإشعارات</strong>
        <div class="notification-list" id="notificationText"></div>
      </div>
    </header>

    <aside class="sidebar" aria-label="القائمة الرئيسية">
      <button class="sidebar-close" id="sidebarCloseBtn" type="button" aria-label="إغلاق القائمة">×</button>
      <div class="brand">
        <div class="brand-mark">ع</div>
        <div>
          <h1>خدمات برج العامر</h1>
          <p id="buildingSummary">48 شقة · 12 دور · اشتراك شهري 360 جنيه</p>
        </div>
      </div>

      <div class="account-box">
        <div class="account-mini">
          <span class="account-icon" id="accountIcon"></span>
          <div>
            <span>الحساب الحالي</span>
            <strong id="currentUserText"></strong>
          </div>
        </div>
        <button id="logoutBtn" class="ghost-btn" type="button">تسجيل خروج</button>
      </div>

      <nav class="nav">
        <button class="nav-link active" data-view="dashboard"><span><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/></svg></span>الرئيسية</button>
        <button class="nav-link" data-view="apartments"><span><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20V5h12v15"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/></svg></span>الشقق</button>
        <button class="nav-link" data-view="payments"><span><svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M4 10h16"/><path d="M8 15h4"/></svg></span>المدفوعات</button>
        <button class="nav-link" data-view="expenses"><span><svg viewBox="0 0 24 24"><path d="M7 3h10v18H7z"/><path d="M9.5 8h5M9.5 12h5M9.5 16h3"/></svg></span>المصروفات</button>
        <button class="nav-link" data-view="sharedCharges"><span><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M6 11h12"/><path d="M8 15h8"/><path d="M10 19h4"/></svg></span>مطالبات جماعية</button>
        <button class="nav-link" data-view="reports"><span><svg viewBox="0 0 24 24"><path d="M5 19V5"/><path d="M5 19h14"/><path d="M9 16v-5M13 16V8M17 16v-7"/></svg></span>التقارير</button>
        <button class="nav-link" data-view="account"><span><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></span>حسابي</button>
      </nav>

      <div class="storage-actions">
        <button id="exportBtn" class="ghost-btn">تصدير PDF</button>
        <label class="ghost-btn file-label">
          استيراد
          <input id="importFile" type="file" accept="application/json">
        </label>
        <button id="resetBtn" class="danger-ghost">بدء جديد</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-notifications">
          <button class="desktop-notify-btn" id="desktopNotifyBtn" type="button" aria-label="الإشعارات">
            <span>🔔</span>
            <b id="desktopNotifyBadge" hidden>0</b>
            <strong>الإشعارات</strong>
          </button>
          <div class="notification-popover desktop-notification-popover" id="desktopNotificationPanel" hidden>
            <strong>الإشعارات</strong>
            <div class="notification-list" id="desktopNotificationText"></div>
          </div>
        </div>
        <div class="topbar-title">
          <p class="eyebrow" id="todayText"></p>
          <h2 id="viewTitle">الرئيسية</h2>
        </div>
        <div class="topbar-actions">
          <div class="month-control">
            <label>الشهر</label>
            <div class="month-picker" aria-label="اختيار الشهر">
              <select id="monthSelect"></select>
              <select id="yearSelect"></select>
            </div>
          </div>
        </div>
      </header>

      <section id="dashboardView" class="view active"></section>
      <section id="apartmentsView" class="view"></section>
      <section id="paymentsView" class="view"></section>
      <section id="expensesView" class="view"></section>
      <section id="sharedChargesView" class="view"></section>
      <section id="reportsView" class="view"></section>
      <section id="accountView" class="view"></section>
      <footer class="system-credit app-credit">
        <a href="https://wa.me/971551806906" target="_blank" rel="noopener">Designed by Eng. ABDALLA EID</a>
      </footer>
    </main>
  </div>

  <dialog id="imageDialog">
    <button class="dialog-close" id="closeDialog" aria-label="إغلاق">×</button>
    <img id="dialogImage" alt="صورة مرفقة">
  </dialog>

  <dialog class="confirm-dialog" id="apartmentDeleteDialog">
    <form id="apartmentDeleteForm" method="dialog" class="confirm-card">
      <div class="confirm-icon">!</div>
      <div>
        <h3>تأكيد حذف الشقة</h3>
        <p id="apartmentDeleteText"></p>
      </div>
      <div class="field">
        <label for="apartmentDeletePassword">الرقم السري للحذف</label>
        <input id="apartmentDeletePassword" name="deletePassword" type="password" inputmode="numeric" autocomplete="off" required>
      </div>
      <p class="confirm-error" id="apartmentDeleteError" hidden></p>
      <div class="confirm-actions">
        <button class="danger-btn" type="submit">حذف نهائي</button>
        <button class="secondary-btn" id="cancelApartmentDeleteBtn" type="button">إلغاء</button>
      </div>
    </form>
  </dialog>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <strong></strong>
      <p></p>
    </div>
  </template>

  <script src="app.js?v=20261007-brand"></script>
<a class="abdeid-signature" href="https://github.com/ABDEID-dev" target="_blank" rel="noopener" aria-label="Designed by Abdallah Eid"><img src="assets/abdeid-logo.png" alt="ABDEID"><span>ABDEID<small>Abdallah Eid</small></span></a>
</body>
</html>
