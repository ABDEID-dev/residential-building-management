<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول - خدمات برج العامر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261007-brand">
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="auth-visual" aria-hidden="true">
      <div class="tower-scene">
        <span class="sun"></span>
        <span class="cloud cloud-one"></span>
        <span class="cloud cloud-two"></span>
        <div class="tower tower-one">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="tower tower-two">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="tower tower-three">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <form class="auth-card" id="loginForm">
        <div class="brand auth-brand">
          <div class="brand-mark">ع</div>
          <div>
            <h1>خدمات برج العامر</h1>
            <p>بوابة السكان والإدارة</p>
          </div>
        </div>

        <div class="auth-copy">
          <h2>تسجيل الدخول</h2>
          <p>تابع المدفوعات، المصروفات، والتنبيهات الشهرية من مكان واحد.</p>
        </div>

        <div class="field">
          <label for="loginUsername">اسم المستخدم</label>
          <input id="loginUsername" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">كلمة المرور</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="loginError"></p>
        <button class="primary-btn auth-submit" type="submit">دخول إلى الداشبورد</button>
      </form>
      <footer class="system-credit">
        <a href="https://wa.me/971551806906" target="_blank" rel="noopener">Designed by Eng. ABDALLA EID</a>
      </footer>
    </section>
  </main>

  <script src="app.js?v=20261007-brand"></script>
<a class="abdeid-signature" href="https://github.com/ABDEID-dev" target="_blank" rel="noopener" aria-label="Designed by Abdallah Eid"><img src="assets/abdeid-logo.png" alt="ABDEID"><span>ABDEID<small>Abdallah Eid</small></span></a>
</body>
</html>
